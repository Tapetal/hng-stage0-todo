<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HNG Stage 1A — Advanced Todo Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #181c27;
      --surface-2: #1e2436;
      --border: #2a3045;
      --text: #e8eaf0;
      --text-muted: #7c85a0;
      --text-dim: #4a5270;
      --accent: #6c8aff;
      --high: #ff6b6b;
      --high-bg: rgba(255,107,107,0.12);
      --med: #ffc947;
      --med-bg: rgba(255,201,71,0.12);
      --low: #43e08b;
      --low-bg: rgba(67,224,139,0.12);
      --done-color: #43e08b;
      --done-bg: rgba(67,224,139,0.1);
      --overdue: #ff6b6b;
      --overdue-bg: rgba(255,107,107,0.1);
      --radius: 20px;
      --radius-sm: 10px;
      --font: 'DM Sans', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    html, body { min-height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px 16px;
      background-image:
        radial-gradient(ellipse 60% 40% at 20% 10%, rgba(108,138,255,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 80% 90%, rgba(67,224,139,0.05) 0%, transparent 60%);
    }

    /* ── Card ── */
    article.todo-card {
      width: 100%;
      max-width: 520px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      overflow-wrap: break-word;
      position: relative;
      border-left: 4px solid var(--border);
      transition: border-left-color 0.3s;
    }

    /* Priority left border */
    article.todo-card.priority-high  { border-left-color: var(--high); }
    article.todo-card.priority-medium { border-left-color: var(--med); }
    article.todo-card.priority-low   { border-left-color: var(--low); }

    /* Done state */
    article.todo-card.status-done { opacity: 0.75; }
    article.todo-card.status-done .todo-title { text-decoration: line-through; color: var(--text-muted); }
    article.todo-card.status-done .todo-description { color: var(--text-dim); }

    /* Overdue state */
    article.todo-card.is-overdue .time-remaining { color: var(--overdue) !important; }

    /* ── Priority indicator dot ── */
    .priority-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .priority-indicator {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .priority-high  .priority-indicator { background: var(--high);  box-shadow: 0 0 8px var(--high); }
    .priority-medium .priority-indicator { background: var(--med);   box-shadow: 0 0 8px var(--med); }
    .priority-low   .priority-indicator { background: var(--low);   box-shadow: 0 0 8px var(--low); }

    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 11px; border-radius: 999px;
      font-size: 0.78rem; font-weight: 700;
      font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.03em;
    }
    .badge-high   { background: var(--high-bg); color: var(--high); }
    .badge-medium { background: var(--med-bg);  color: var(--med); }
    .badge-low    { background: var(--low-bg);  color: var(--low); }
    .badge-progress { background: rgba(108,138,255,0.12); color: var(--accent); }
    .badge-done   { background: var(--done-bg); color: var(--done-color); }
    .badge-pending { background: rgba(255,201,71,0.12); color: var(--med); }

    /* ── Title & desc ── */
    h2.todo-title {
      font-size: 1.2rem; font-weight: 700; line-height: 1.35;
      letter-spacing: -0.02em; transition: color 0.3s;
    }
    p.todo-description { font-size: 0.9rem; line-height: 1.65; color: var(--text-muted); margin-top: 8px; }

    /* ── Divider ── */
    .divider { height: 1px; background: var(--border); margin: 18px 0; }

    /* ── Time block ── */
    .time-block { display: flex; flex-direction: column; gap: 6px; }
    time.todo-due-date { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }
    time.todo-due-date::before { content: '📅 '; }
    time.todo-time-remaining { font-size: 0.92rem; font-weight: 700; color: var(--accent); font-family: var(--font-mono); }

    .overdue-indicator {
      display: none; align-items: center; gap: 6px;
      padding: 6px 12px; background: var(--overdue-bg);
      border: 1px solid rgba(255,107,107,0.25); border-radius: 999px;
      font-size: 0.8rem; font-weight: 700; color: var(--overdue);
      font-family: var(--font-mono); width: fit-content;
    }
    .overdue-indicator.visible { display: flex; }

    /* ── Expand/collapse ── */
    .desc-container { position: relative; }
    .desc-truncated { overflow: hidden; transition: max-height 0.3s ease; }
    .expand-toggle {
      background: none; border: none; color: var(--accent);
      font-size: 0.82rem; font-weight: 600; cursor: pointer;
      padding: 4px 0; font-family: var(--font);
      display: none;
    }
    .expand-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
    .expand-toggle.show { display: inline-flex; align-items: center; gap: 4px; }

    /* ── Collapsible section ── */
    .collapsible-section { display: flex; flex-direction: column; gap: 0; }

    /* ── Checkbox row ── */
    .checkbox-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; background: var(--surface-2);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      cursor: pointer; transition: border-color 0.2s;
    }
    .checkbox-row:hover { border-color: var(--accent); }
    .checkbox-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
    .checkbox-row input:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .checkbox-row label { font-size: 0.88rem; font-weight: 600; color: var(--text-muted); cursor: pointer; user-select: none; }

    /* ── Status control ── */
    .status-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .status-row label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }

    select.status-control, select.edit-select {
      background: var(--surface-2); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 8px 12px; font-family: var(--font); font-size: 0.88rem;
      cursor: pointer; outline: none; transition: border-color 0.2s;
    }
    select.status-control:focus, select.edit-select:focus { border-color: var(--accent); }
    select.status-control:focus-visible, select.edit-select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    /* ── Tags ── */
    ul.tags { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
    ul.tags li {
      background: var(--surface-2); color: var(--text-muted);
      border: 1px solid var(--border); padding: 4px 11px;
      border-radius: 999px; font-size: 0.8rem; font-weight: 600;
      font-family: var(--font-mono);
    }
    ul.tags li::before { content: '#'; color: var(--accent); margin-right: 2px; }

    /* ── Actions ── */
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .actions button {
      flex: 1; min-width: 90px; border: none; border-radius: var(--radius-sm);
      padding: 11px 14px; font-size: 0.88rem; font-weight: 700;
      font-family: var(--font); cursor: pointer; transition: opacity 0.15s, transform 0.15s;
    }
    .actions button:active { transform: scale(0.97); }
    .actions button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    #edit-btn { background: var(--accent); color: #fff; }
    #edit-btn:hover { opacity: 0.85; }
    #delete-btn { background: var(--high-bg); color: var(--high); border: 1px solid rgba(255,107,107,0.2); }
    #delete-btn:hover { background: rgba(255,107,107,0.22); }

    /* ── Edit Form ── */
    .edit-form {
      display: none; flex-direction: column; gap: 14px;
      padding: 20px; background: var(--surface-2);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
    }
    .edit-form.open { display: flex; }
    .edit-form h3 { font-size: 1rem; color: var(--accent); margin-bottom: 4px; }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.82rem; font-weight: 600; color: var(--text-muted); }

    .edit-form input[type="text"],
    .edit-form input[type="date"],
    .edit-form textarea,
    .edit-form select {
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 9px 12px; font-family: var(--font); font-size: 0.88rem;
      width: 100%; outline: none; transition: border-color 0.2s;
    }
    .edit-form input:focus, .edit-form textarea:focus, .edit-form select:focus { border-color: var(--accent); }
    .edit-form input:focus-visible, .edit-form textarea:focus-visible, .edit-form select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .edit-form textarea { resize: vertical; min-height: 80px; }

    .form-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .form-actions button {
      flex: 1; min-width: 80px; border: none; border-radius: 8px;
      padding: 10px 14px; font-size: 0.88rem; font-weight: 700;
      font-family: var(--font); cursor: pointer; transition: opacity 0.15s;
    }
    .form-actions button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    #save-btn { background: var(--accent); color: #fff; }
    #save-btn:hover { opacity: 0.85; }
    #cancel-btn { background: var(--surface); color: var(--text-muted); border: 1px solid var(--border); }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      article.todo-card { padding: 18px; }
      h2.todo-title { font-size: 1.05rem; }
    }
    @media (min-width: 768px) {
      article.todo-card { padding: 32px; }
    }
  </style>
</head>
<body>

<article
  id="todo-card"
  class="todo-card priority-high"
  data-testid="test-todo-card"
  aria-labelledby="todo-title"
>

  <!-- Priority row -->
  <div class="priority-row" id="priority-row">
    <span
      class="priority-indicator"
      id="priority-indicator"
      data-testid="test-todo-priority-indicator"
      aria-hidden="true"
    ></span>
    <span
      id="priority-badge"
      class="badge badge-high"
      data-testid="test-todo-priority"
      aria-label="Priority: High"
    >High</span>
    <span
      id="status-badge"
      class="badge badge-progress"
      data-testid="test-todo-status"
      aria-label="Status: In Progress"
    >In Progress</span>
  </div>

  <div class="divider"></div>

  <!-- Title -->
  <h2 id="todo-title" class="todo-title" data-testid="test-todo-title">
    Finish HNG Stage 1A Todo Card
  </h2>

  <!-- Description with expand/collapse -->
  <div class="desc-container">
    <div
      id="collapsible-section"
      class="collapsible-section"
      data-testid="test-todo-collapsible-section"
    >
      <div id="desc-truncated" class="desc-truncated">
        <p class="todo-description" data-testid="test-todo-description" id="todo-desc">
          Build an advanced, accessible, interactive task card for HNG Stage 1A with editable content, status transitions, priority indicators, expand/collapse behavior, and dynamic overdue logic.
        </p>
      </div>
      <button
        id="expand-toggle"
        class="expand-toggle"
        data-testid="test-todo-expand-toggle"
        aria-expanded="false"
        aria-controls="collapsible-section"
      >
        <span id="expand-label">Show more ▾</span>
      </button>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Time block -->
  <div class="time-block">
    <time
      id="due-date-el"
      class="todo-due-date"
      data-testid="test-todo-due-date"
    ></time>

    <time
      id="time-remaining-el"
      class="todo-time-remaining"
      data-testid="test-todo-time-remaining"
      aria-live="polite"
    ></time>

    <div
      id="overdue-indicator"
      class="overdue-indicator"
      data-testid="test-todo-overdue-indicator"
      role="status"
      aria-label="This task is overdue"
    >
      ⚠️ Overdue
    </div>
  </div>

  <div class="divider"></div>

  <!-- Checkbox + Status Control -->
  <div style="display:flex; flex-direction:column; gap:12px;">
    <div class="checkbox-row">
      <input
        type="checkbox"
        id="complete-task"
        data-testid="test-todo-complete-toggle"
        aria-label="Mark task as complete"
      />
      <label for="complete-task">Mark as complete</label>
    </div>

    <div class="status-row">
      <label for="status-control" id="status-label">Status:</label>
      <select
        id="status-control"
        class="status-control"
        data-testid="test-todo-status-control"
        aria-labelledby="status-label"
      >
        <option value="Pending">Pending</option>
        <option value="In Progress" selected>In Progress</option>
        <option value="Done">Done</option>
      </select>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Tags -->
  <ul class="tags" data-testid="test-todo-tags" role="list" aria-label="Task tags">
    <li data-testid="test-todo-tag-work">work</li>
    <li data-testid="test-todo-tag-urgent">urgent</li>
    <li>design</li>
  </ul>

  <div class="divider"></div>

  <!-- Actions -->
  <div class="actions">
    <button id="edit-btn" type="button" data-testid="test-todo-edit-button" aria-label="Edit task">✏️ Edit</button>
    <button id="delete-btn" type="button" data-testid="test-todo-delete-button" aria-label="Delete task">🗑️ Delete</button>
  </div>

  <!-- Edit Form (hidden by default) -->
  <div class="divider" id="edit-divider" style="display:none;"></div>

  <div
    id="edit-form"
    class="edit-form"
    data-testid="test-todo-edit-form"
    role="group"
    aria-label="Edit task form"
  >
    <h3>Edit Task</h3>

    <div class="form-group">
      <label for="edit-title-input">Title</label>
      <input
        type="text"
        id="edit-title-input"
        data-testid="test-todo-edit-title-input"
        placeholder="Task title"
        aria-required="true"
      />
    </div>

    <div class="form-group">
      <label for="edit-desc-input">Description</label>
      <textarea
        id="edit-desc-input"
        data-testid="test-todo-edit-description-input"
        placeholder="Task description"
        rows="3"
      ></textarea>
    </div>

    <div class="form-group">
      <label for="edit-priority-select">Priority</label>
      <select
        id="edit-priority-select"
        data-testid="test-todo-edit-priority-select"
      >
        <option value="Low">Low</option>
        <option value="Medium">Medium</option>
        <option value="High" selected>High</option>
      </select>
    </div>

    <div class="form-group">
      <label for="edit-due-date-input">Due Date</label>
      <input
        type="date"
        id="edit-due-date-input"
        data-testid="test-todo-edit-due-date-input"
      />
    </div>

    <div class="form-actions">
      <button id="save-btn" type="button" data-testid="test-todo-save-button">💾 Save</button>
      <button id="cancel-btn" type="button" data-testid="test-todo-cancel-button">✕ Cancel</button>
    </div>
  </div>

</article>

<script>
  // ── State ──
  const state = {
    title: 'Finish HNG Stage 1A Todo Card',
    description: 'Build an advanced, accessible, interactive task card for HNG Stage 1A with editable content, status transitions, priority indicators, expand/collapse behavior, and dynamic overdue logic.',
    priority: 'High',
    status: 'In Progress',
    dueDate: new Date(Date.now() + (3 * 24 + 2) * 3600000),
    completed: false,
    expanded: false,
  };

  // Save snapshot for cancel
  let snapshot = { ...state };

  // ── Element refs ──
  const card            = document.getElementById('todo-card');
  const titleEl         = document.getElementById('todo-title');
  const descEl          = document.getElementById('todo-desc');
  const priorityBadge   = document.getElementById('priority-badge');
  const priorityIndicator = document.getElementById('priority-indicator');
  const priorityRow     = document.getElementById('priority-row');
  const statusBadge     = document.getElementById('status-badge');
  const dueDateEl       = document.getElementById('due-date-el');
  const timeRemainingEl = document.getElementById('time-remaining-el');
  const overdueEl       = document.getElementById('overdue-indicator');
  const checkbox        = document.getElementById('complete-task');
  const statusControl   = document.getElementById('status-control');
  const expandToggle    = document.getElementById('expand-toggle');
  const expandLabel     = document.getElementById('expand-label');
  const descTruncated   = document.getElementById('desc-truncated');
  const editBtn         = document.getElementById('edit-btn');
  const deleteBtn       = document.getElementById('delete-btn');
  const editForm        = document.getElementById('edit-form');
  const editDivider     = document.getElementById('edit-divider');
  const editTitleInput  = document.getElementById('edit-title-input');
  const editDescInput   = document.getElementById('edit-desc-input');
  const editPriority    = document.getElementById('edit-priority-select');
  const editDueDate     = document.getElementById('edit-due-date-input');
  const saveBtn         = document.getElementById('save-btn');
  const cancelBtn       = document.getElementById('cancel-btn');

  // ── Helpers ──
  const TRUNCATE_LENGTH = 120;

  function formatDueDate(d) {
    return 'Due ' + new Intl.DateTimeFormat('en-US', {
      month: 'short', day: 'numeric', year: 'numeric'
    }).format(d);
  }

  function getTimeRemaining(d) {
    if (state.status === 'Done') return '✓ Completed';
    const diff = d - Date.now();
    const abs  = Math.abs(diff);
    const mins = Math.floor(abs / 60000);
    const hrs  = Math.floor(abs / 3600000);
    const days = Math.floor(abs / 86400000);
    if (abs < 60000)  return 'Due now!';
    if (diff > 0) {
      if (days >= 2)  return `Due in ${days} days`;
      if (days === 1) return 'Due tomorrow';
      if (hrs >= 1)   return `Due in ${hrs} hour${hrs > 1 ? 's' : ''}`;
      return          `Due in ${mins} minute${mins !== 1 ? 's' : ''}`;
    }
    if (days >= 1)    return `Overdue by ${days} day${days > 1 ? 's' : ''}`;
    if (hrs >= 1)     return `Overdue by ${hrs} hour${hrs > 1 ? 's' : ''}`;
    return            `Overdue by ${mins} minute${mins !== 1 ? 's' : ''}`;
  }

  function isOverdue() {
    return state.dueDate < new Date() && state.status !== 'Done';
  }

  // ── Render ──
  function render() {
    const p = state.priority.toLowerCase();
    const s = state.status.toLowerCase().replace(/\s+/g, '-');

    // Card classes
    card.className = `todo-card priority-${p} ${state.status === 'Done' ? 'status-done' : ''} ${isOverdue() ? 'is-overdue' : ''}`;

    // Title
    titleEl.textContent = state.title;

    // Description
    descEl.textContent = state.description;

    // Expand/collapse
    const needsCollapse = state.description.length > TRUNCATE_LENGTH;
    if (needsCollapse) {
      expandToggle.classList.add('show');
      if (!state.expanded) {
        descTruncated.style.maxHeight = '3.5em';
        descTruncated.style.overflow  = 'hidden';
        expandLabel.textContent = 'Show more ▾';
        expandToggle.setAttribute('aria-expanded', 'false');
      } else {
        descTruncated.style.maxHeight = 'none';
        descTruncated.style.overflow  = 'visible';
        expandLabel.textContent = 'Show less ▴';
        expandToggle.setAttribute('aria-expanded', 'true');
      }
    } else {
      expandToggle.classList.remove('show');
      descTruncated.style.maxHeight = 'none';
    }

    // Priority badge
    priorityBadge.textContent = state.priority;
    priorityBadge.className   = `badge badge-${p}`;
    priorityBadge.setAttribute('aria-label', `Priority: ${state.priority}`);
    priorityRow.className     = `priority-row priority-${p}`;

    // Status badge
    statusBadge.textContent = state.status;
    statusBadge.className   = `badge badge-${s}`;
    statusBadge.setAttribute('aria-label', `Status: ${state.status}`);

    // Status control
    statusControl.value = state.status;

    // Checkbox
    checkbox.checked = state.status === 'Done';

    // Due date & time
    dueDateEl.textContent = formatDueDate(state.dueDate);
    dueDateEl.setAttribute('datetime', state.dueDate.toISOString());
    timeRemainingEl.textContent = getTimeRemaining(state.dueDate);
    timeRemainingEl.setAttribute('datetime', state.dueDate.toISOString());

    // Overdue indicator
    if (isOverdue()) {
      overdueEl.classList.add('visible');
    } else {
      overdueEl.classList.remove('visible');
    }
  }

  // ── Apply status logic ──
  function applyStatus(newStatus) {
    state.status = newStatus;
    state.completed = newStatus === 'Done';
    render();
  }

  // ── Checkbox ──
  checkbox.addEventListener('change', () => {
    if (checkbox.checked) {
      applyStatus('Done');
    } else {
      applyStatus('Pending');
    }
  });

  // ── Status control ──
  statusControl.addEventListener('change', () => {
    applyStatus(statusControl.value);
  });

  // ── Expand toggle ──
  expandToggle.addEventListener('click', () => {
    state.expanded = !state.expanded;
    render();
  });

  // ── Edit button ──
  editBtn.addEventListener('click', () => {
    snapshot = { ...state, dueDate: new Date(state.dueDate) };
    editTitleInput.value = state.title;
    editDescInput.value  = state.description;
    editPriority.value   = state.priority;
    editDueDate.value    = state.dueDate.toISOString().slice(0, 10);
    editForm.classList.add('open');
    editDivider.style.display = 'block';
    editTitleInput.focus();
  });

  // ── Save button ──
  saveBtn.addEventListener('click', () => {
    const newTitle = editTitleInput.value.trim();
    const newDesc  = editDescInput.value.trim();
    if (newTitle) state.title = newTitle;
    if (newDesc)  state.description = newDesc;
    state.priority = editPriority.value;
    if (editDueDate.value) {
      const [year, month, day] = editDueDate.value.split('-').map(Number);
      state.dueDate = new Date(year, month - 1, day, 23, 59, 59);
  }
    closeEditForm();
    render();
  });

  // ── Cancel button ──
  cancelBtn.addEventListener('click', () => {
    Object.assign(state, snapshot);
    closeEditForm();
    render();
  });

  function closeEditForm() {
    editForm.classList.remove('open');
    editDivider.style.display = 'none';
    editBtn.focus();
  }

  // ── Delete button ──
  deleteBtn.addEventListener('click', () => {
    alert('Delete clicked');
  });

  // ── Time interval ──
  setInterval(() => {
    if (state.status !== 'Done') {
      timeRemainingEl.textContent = getTimeRemaining(state.dueDate);
    }
  }, 30000);

  // ── Init ──
  render();
</script>
</body>
</html>
